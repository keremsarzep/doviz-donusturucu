<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Döviz Dönüştürücü</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="converter-box">
        <h2>Döviz Dönüştürücü</h2>
        
        <div class="input-group">
            <label>Miktar:</label>
            <input type="number" id="amount" value="1" min="1">
        </div>

        <div class="currency-group">
            <div class="select-box">
                <label>Kaynak:</label>
                <select id="from-currency">
                    <option value="USD">USD - Dolar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP" selected>GBP - Sterlin</option>
                    <option value="TRY">TRY - Türk Lirası</option>
                </select>
            </div>

            <button id="swap-btn" onclick="swapCurrencies()">⇄</button>

            <div class="select-box">
                <label>Hedef:</label>
                <select id="to-currency">
                    <option value="USD">USD - Dolar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - Sterlin</option>
                    <option value="TRY" selected>TRY - Türk Lirası</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <span id="result-text">Yükleniyor...</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
